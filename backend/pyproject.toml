[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "langchain-core>=1.7.4",
    "langchain-openai>=1.1.0",
    "pinecone>=10.3.0",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.1",
    "supabase>=2.27.0,<3",
    "tavily-python>=0.8.5",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.fastapi]
entrypoint = "src.main:app"

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "api", "config", "helpers", "ingestion", "integrations", "repositories", "services", "storage"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
markers = [
    "integration: exercises live external services (Supabase, Groq); deselected by default",
]
addopts = "-m 'not integration' --import-mode=importlib"
